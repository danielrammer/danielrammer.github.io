<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" role="img" aria-labelledby="title desc">
<title id="title">CitiFoxCharger architecture</title>
<desc id="desc">The browser connects to a Python backend on the Windows tablet. The backend reads SMARTFOX registers over Modbus TCP and reads values and controls modes through its local web interface. It separately connects to the Skoda Public API for battery state and start/stop commands. SMARTFOX controls the charger; the car reports through the manufacturer's cloud.</desc>
