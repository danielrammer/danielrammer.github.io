<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <canvas id="webgl-canvas"></canvas>
    <div id="vanta-bg"></div>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
    <script src="{{ '/js/main.js' | prepend: site.baseurl }}"></script>
	  <script src="{{ '/js/scrollTo.js' | prepend: site.baseurl }}"></script>

    <!-- Vanta dependencies (ORDER MATTERS) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <!-- Vanta initialization -->
    <script>
      VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0xffffff,
        backgroundColor: 0xf0f0f0,
        points: 16.0,
        maxDistance: 21.0,
        showDots: false
      })
    </script>
    <!-- <script
      type="module"
      src="{{ '/js/background.js' | prepend: site.baseurl | relative_url }}">
    </script> -->
  </body>
</html>
