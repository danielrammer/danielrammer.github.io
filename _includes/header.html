<nav class="nav">
  <a class="nav_brand" href="{{ '/' | prepend: site.baseurl }}">Daniel Rammer</a>
  {% comment %}
  <div class="logo">
    <a class="logo_link" href="{{'/' | prepend: site.baseurl | prepend: site.url}}">
      {% include icons/logo.svg %}
    </a>
  </div>
  {% endcomment %}
  <div class="menu_toggle">
    <button id="menu_toggle_button" class="menu_toggle_button" type="button" aria-controls="nav_list" aria-expanded="false" aria-label="Toggle navigation">
      {% include icons/menu.svg %}
    </button>
  </div>
  <ul id="nav_list" class="nav_list" role="menubar">
    {% assign navitems = site.data.navigation | sort: "weight" %}
    {% for navitem in navitems %}
      <li class="nav_item" role="presentation">
        <a class="nav_link" href="{{navitem.link | prepend: '/' | prepend: site.baseurl}}" role="menuitem">{{navitem.name}}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
